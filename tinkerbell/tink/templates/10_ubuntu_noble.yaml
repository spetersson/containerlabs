apiVersion: "tinkerbell.org/v1alpha1"
kind: Template
metadata:
  name: ubuntu-noble
spec:
  data: |
    version: "0.1"
    name: ubuntu-noble
    global_timeout: 1800
    tasks:
      - name: "os installation"
        worker: "{{.device_1}}"
        volumes:
          - /dev:/dev
        actions:
          - name: "stream ubuntu image"
            image: quay.io/tinkerbell/actions/image2disk:latest
            timeout: 600
            environment:
              DEST_DISK: {{ index .Hardware.Disks 0 }}
              IMG_URL: "http://192.168.2.10:8787/noble-server-cloudimg-amd64.raw.gz"
              COMPRESSED: true
          - name: "grow-partition"
            image: quay.io/tinkerbell/actions/cexec:latest
            timeout: 180
            environment:
              BLOCK_DEVICE: {{ formatPartition ( index .Hardware.Disks 0 ) 1 }}
              FS_TYPE: ext4
              CHROOT: y
              DEFAULT_INTERPRETER: "/bin/sh -c"
              CMD_LINE: "sleep 5 && growpart {{ index .Hardware.Disks 0 }} 1 && resize2fs {{ formatPartition ( index .Hardware.Disks 0 ) 1 }}"
          - name: "install openssl"
            image: quay.io/tinkerbell/actions/cexec:latest
            timeout: 180
            environment:
              BLOCK_DEVICE: {{ formatPartition ( index .Hardware.Disks 0 ) 1 }}
              FS_TYPE: ext4
              CHROOT: y
              DEFAULT_INTERPRETER: "/bin/sh -c"
              CMD_LINE: "apt -y update && apt -y install openssl"
          - name: "create user"
            image: quay.io/tinkerbell/actions/cexec:latest
            timeout: 180
            environment:
              BLOCK_DEVICE: {{ formatPartition ( index .Hardware.Disks 0 ) 1 }}
              FS_TYPE: ext4
              CHROOT: y
              DEFAULT_INTERPRETER: "/bin/sh -c"
              CMD_LINE: "useradd -p $(openssl passwd -1 tink) -s /bin/bash -d /home/tink/ -m -G sudo tink"
          - name: "enable ssh"
            image: quay.io/tinkerbell/actions/cexec:latest
            timeout: 180
            environment:
              BLOCK_DEVICE: {{ formatPartition ( index .Hardware.Disks 0 ) 1 }}
              FS_TYPE: ext4
              CHROOT: y
              DEFAULT_INTERPRETER: "/bin/sh -c"
              CMD_LINE: "ssh-keygen -A; systemctl enable ssh.service; echo 'PasswordAuthentication yes' > /etc/ssh/sshd_config.d/60-cloudimg-settings.conf"
          - name: "disable apparmor"
            image: quay.io/tinkerbell/actions/cexec:latest
            timeout: 180
            environment:
              BLOCK_DEVICE: {{ formatPartition ( index .Hardware.Disks 0 ) 1 }}
              FS_TYPE: ext4
              CHROOT: y
              DEFAULT_INTERPRETER: "/bin/sh -c"
              CMD_LINE: "systemctl disable apparmor; systemctl disable snapd"
          - name: nettest-chroot
            image: quay.io/tinkerbell/actions/cexec:latest
            timeout: 120
            environment:
              BLOCK_DEVICE: "{{ formatPartition ( index .Hardware.Disks 0 ) 1 }}"
              FS_TYPE: ext4
              CHROOT: "y"
              DEFAULT_INTERPRETER: "/bin/sh -c"
              CMD_LINE: >-
                echo '== resolv.conf'; ls -l /etc/resolv.conf; cat /etc/resolv.conf;
                echo '== ping by IP'; ping -c 3 -W 2 1.1.1.1;
                echo '== DNS'; getent hosts archive.ubuntu.com;
                echo '== DNS with fixed resolver';
                cp -P /etc/resolv.conf /tmp/resolv.bak; rm -f /etc/resolv.conf;
                echo 'nameserver 1.1.1.1' > /etc/resolv.conf;
                getent hosts archive.ubuntu.com;
                apt-get install -y linux-generic htop vim;
                apt-get autoremove -y;
                rm -f /etc/resolv.conf; cp -P /tmp/resolv.bak /etc/resolv.conf;
                true
          - name: "write netplan"
            image: quay.io/tinkerbell/actions/writefile:latest
            timeout: 180
            environment:
              DEST_DISK: {{ formatPartition ( index .Hardware.Disks 0 ) 1 }}
              FS_TYPE: ext4
              DEST_PATH: /etc/netplan/config.yaml
              CONTENTS: |
                network:
                  version: 2
                  renderer: networkd
                  ethernets:
                    id0:
                      match:
                        name: en*
                      dhcp4: true
              UID: 0
              GID: 0
              MODE: 0644
              DIRMODE: 0755
          {{- if regexMatch "a(arch|rm)" (lower (index .Hardware.Interfaces 0).DHCP.Arch) }}
          - name: "reboot into os"
          {{- else }}
          - name: "kexec into os"
          {{- end }}
            image: ghcr.io/jacobweinstock/waitdaemon:latest
            timeout: 180
            {{- if regexMatch "a(arch|rm)" (lower (index .Hardware.Interfaces 0).DHCP.Arch) }}
            command: ["sh", "-c", "echo 1 > /proc/sys/kernel/sysrq && echo b > /proc/sysrq-trigger"]
            {{- end }}
            pid: host
            environment:
              BLOCK_DEVICE: {{ formatPartition ( index .Hardware.Disks 0 ) 1 }}
              FS_TYPE: ext4
              {{- if regexMatch "a(arch|rm)" (lower (index .Hardware.Interfaces 0).DHCP.Arch) }}
              IMAGE: alpine:latest
              {{- else }}
              IMAGE: quay.io/tinkerbell/actions/kexec:latest
              {{- end }}
              WAIT_SECONDS: 5
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock

