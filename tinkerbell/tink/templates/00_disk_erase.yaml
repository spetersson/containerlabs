---
apiVersion: "tinkerbell.org/v1alpha1"
kind: Template
metadata:
  name: disk-erase
spec:
  data: |
    name: disk-erase
    version: "0.1"
    global_timeout: 300
    tasks:
      - name: "disk erase"
        worker: "{{.device_1}}"
        environment:
          MIRROR_HOST: 192.168.2.10
        actions:
          - name: "wipe"
            image: quay.io/tinkerbell/actions/rootio:latest
            timeout: 90
            command: ["partition"]
          - name: "format"
            image: quay.io/tinkerbell/actions/rootio:latest
            timeout: 90
            command: ["format"]
          - name: "mount"
            image: quay.io/tinkerbell/actions/rootio:latest
            timeout: 90
            command: ["mount"]
