---
apiVersion: tinkerbell.org/v1alpha1
kind: Template
metadata:
  name: nettest
  namespace: default
spec:
  data: |
    name: nettest
    version: "0.1"
    global_timeout: 300
    tasks:
      - name: nettest
        worker: "{{.device_1}}"
        volumes:
          - /dev:/dev
          - /dev/console:/dev/console
        actions:
          # 1. Network as seen by HookOS itself
          - name: nettest-hookos
            image: alpine
            timeout: 120
            command:
              - /bin/sh
              - -c
              - |
                echo "== addresses";  ip -br addr
                echo "== routes";     ip route
                echo "== resolv.conf"; cat /etc/resolv.conf
                echo "== ping gateway"; ping -c 3 -W 2 192.168.2.1
                echo "== ping internet by IP"; ping -c 3 -W 2 1.1.1.1
                echo "== DNS"; nslookup archive.ubuntu.com
                echo "== HTTP"; wget -q -O /dev/null http://archive.ubuntu.com/ubuntu/ && echo OK
                true

          # 2. Network as seen inside a chroot of the installed Ubuntu root
          #    (requires a previous install on partition 1 of the first disk)
          - name: nettest-chroot
            image: quay.io/tinkerbell/actions/cexec:latest
            timeout: 120
            environment:
              BLOCK_DEVICE: "{{ formatPartition ( index .Hardware.Disks 0 ) 1 }}"
              FS_TYPE: ext4
              CHROOT: "y"
              DEFAULT_INTERPRETER: "/bin/sh -c"
              CMD_LINE: >-
                echo '== resolv.conf'; ls -l /etc/resolv.conf; cat /etc/resolv.conf;
                echo '== ping by IP'; ping -c 3 -W 2 1.1.1.1;
                echo '== DNS'; getent hosts archive.ubuntu.com;
                echo '== DNS with fixed resolver';
                cp -P /etc/resolv.conf /tmp/resolv.bak; rm -f /etc/resolv.conf;
                echo 'nameserver 1.1.1.1' > /etc/resolv.conf;
                getent hosts archive.ubuntu.com;
                apt-get install -y linux-generic htop vim;
                apt-get autoremove -y;
                rm -f /etc/resolv.conf; cp -P /tmp/resolv.bak /etc/resolv.conf;
                true
---
apiVersion: tinkerbell.org/v1alpha1
kind: Workflow
metadata:
  name: vmm1-nettest
  namespace: default
spec:
  templateRef: nettest
  hardwareRef: vmm1
  hardwareMap:
    device_1: "6c:4b:90:ad:ca:e4"
