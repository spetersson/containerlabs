---
# Builds smaller topology for limited testing
name: nokia-srl-cfrr
topology:
  nodes:
    leaf:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux
      startup-config: nokia/leaf.cli
    frr:
      kind: linux
      image: quay.io/frrouting/frr:10.5.0
      binds:
        - frr/daemons:/etc/frr/daemons
        - frr/frr.conf:/etc/frr/frr.conf
  links:
    # leaf <--> frr
    - endpoints: ["leaf:ethernet-1/1", "frr:eth1"]
